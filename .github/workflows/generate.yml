name: Generate Money Reels

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Video topic'
        required: true
        type: choice
        default: auto
        options:
          - auto
          - decoy
          - compound
          - nisa
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install pillow edge-tts

      - name: Generate video
        env:
          TOPIC: ${{ github.event.inputs.topic || 'auto' }}
        run: |
          python render.py --topic "$TOPIC" --output video.mp4

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: money-reels-video
          path: video.mp4
          if-no-files-found: error
          retention-days: 7
